name: JPUS instant critical alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: jpus-instant-alert
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check and dispatch critical items
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JPUS_FEED_URL: https://us-japan-alert.vercel.app/api/feed
        run: node scripts/instant-alert.mjs
