name: JPUS live email alerts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jpus-live-alerts
  cancel-in-progress: true

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Alert delivery paused
        run: echo "Alert delivery is paused while notification precision is repaired."
